# Videókártyás változat. A docker-setup.sh kapcsolja be a .env-ben, ha a gépen van NVIDIA videókártya a dockerhez.
services:
  parkolo:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        PYTORCH_IMAGE: ${PK_PYTORCH_IMAGE:-nvcr.io/nvidia/pytorch:25.09-py3}
    image: parkolo:gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
